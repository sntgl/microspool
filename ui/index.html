{grid-template-columns:1fr 1fr}}.card{background:var(--b);border:1px solid var(--e);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.card.archived{opacity:.6}.card-head{display:flex;align-items:center;gap:8px}.dot{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15);display:inline-block;vertical-align:middle}.card-title{flex:1;min-width:0}.ct-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct-sub{color:var(--d);font-size:12px}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:var(--a);border:1px solid var(--e);color:var(--d);white-space:nowrap}.badge-good{color:var(--h);border-color:var(--h)}.progress{height:6px;border-radius:999px;background:var(--a);overflow:hidden;border:1px solid var(--e)}.progress-fill{height:100%;background:var(--f)}.weights{font-size:13px}.meta{font-size:12px;color:var(--d);overflow-wrap:anywhere}.muted{color:var(--d)}.row{display:flex;gap:8px;flex-wrap:wrap}.use-row{align-items:center}.use-input{width:80px;flex:none}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}.modal{background:var(--b);border-radius:12px;max-width:480px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--e)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0}.modal-body{padding:14px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--d);margin-bottom:4px}.subform{border:1px dashed var(--e);border-radius:10px;padding:10px;margin:6px 0 10px}fieldset{border:none;padding:0;margin:0}.row-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--e)}.ri-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-actions{display:flex;gap:6px;flex:none}#toast-root{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px)}.toast{background:var(--c);color:var(--a);padding:10px 16px;border-radius:8px;font-size:13px;max-width:420px;text-align:center;opacity:1;transition:opacity .3s}.toast.out{opacity:0}</style>

<body>
<div class="topbar">
  <h1 data-i18n="title">microspool</h1>

    <button class="tab-btn active" data-tab="spools" data-i18n="tabSpools"></button>
    <button class="tab-btn" data-tab="filaments" data-i18n="tabFilaments"></button>
    <button class="tab-btn" data-tab="settings" data-i18n="tabSettings"></button>

</div>
<main>

    <h2 data-i18n="vendorsTitle"></h2>

    <p class="muted" data-i18n="moonrakerHint"></p>

</main>

document.documentElement.lang=LANG;
function aa(){
  document.querySelectorAll("[data-i18n]").forEach((el)=>{var k=el.getAttribute("data-i18n");if(T[k]!=null)el.textContent=T[k];});
  document.querySelectorAll("[data-i18n-ph]").forEach((el)=>{var k=el.getAttribute("data-i18n-ph");if(T[k]!=null)el.placeholder=T[k];});
}
var DENSITY={PLA:1.24,PETG:1.27,ABS:1.04,ASA:1.07,TPU:1.21,PA:1.14,PC:1.20};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,(c)=>{return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ab(k,def){try{var v=localStorage.getItem(k);return v==null?def:v;}catch(e){return def;}}
function ac(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ad(id){var el=document.getElementById(id);if(!el)return null;var v=el.value;if(v==="")return null;var n=parseFloat(v);return isFinite(n)?n:null;}
function ae(msg){var root=document.getElementById("toast-root");var d=document.createElement("div");d.className="toast";d.textContent=String(msg);root.appendChild(d);setTimeout(()=>{d.classList.add("out");setTimeout(()=>{d.remove();},300);},3200);}
function ecf(err){ae(err.message||String(err));}
function rr(p,l,r){p.then(l).then(r).catch(ecf);}
function btn(label,act,id,cls){return '<button class="btn'+(cls?" "+cls:"")+'" data-act="'+act+'"'+(id!=null?' data-id="'+id+'"':"")+'>'+label+"</button>";}
function fld(label,html){return '<div class="field"><label>'+label+"</label>"+html+"</div>";}
function ipt(id,attrs,val){return '<input id="'+id+'"'+(attrs||"")+' value="'+(val==null?"":val)+'">';}
function g2(a,b){return '<div class="grid2">'+a+(b||"")+"</div>";}
function nf(id,label,val,extra){return fld(label,ipt(id,' type="number"'+(extra||""),val==null?"":val));}
function nb(body,field,id){var v=ad(id);if(v!=null)body[field]=v;}
function gv(id){return document.getElementById(id).value.trim();}
function sb(body,field,id){body[field]=gv(id);}
function api(method,path,body){
  var opts={method:method};
  if(body!==undefined){opts.headers={"Content-Type":"application/json"};opts.body=JSON.stringify(body);}
  return fetch(path,opts).then((res)=>{
    return res.text().then((text)=>{
      var data=null;
      if(text){try{data=JSON.parse(text);}catch(e){}}
      if(!res.ok){var msg=(data&&data.message)?data.message:(res.status+" "+res.statusText);var err=new Error(msg);err.status=res.status;throw err;}
      return data;
    });
  });
}
var aH={sp:[],fi:[],ve:[],showArchived:false,search:"",bo:null,bc:false,moonrakerUrl:ab("ms_moonraker_url","")};
function af(){return "http://"+location.hostname+":7125";}
function ag(){return (aH.moonrakerUrl||af()).replace(/\/$/,"");}
function ah(){var q=aH.showArchived?"?allow_archived=true":"";return api("GET","/api/v1/spool"+q).then((d)=>{aH.sp=d||[];});}
function ai(){return api("GET","/api/v1/filament").then((d)=>{aH.fi=d||[];});}
function aj(){return api("GET","/api/v1/vendor").then((d)=>{aH.ve=d||[];});}
function ak(){return Promise.all([ah(),ai(),aj()]).catch((e)=>{ae(e.message||String(e));}).then(()=>{ap();as();});}
function al(extra){
  var out={};
  if(!extra)return out;
  Object.keys(extra).forEach((k)=>{
    var raw=extra[k],v;
    try{var p=JSON.parse(raw);v=(typeof p==="string")?p:JSON.stringify(p);}catch(e){v=raw;}
    out[k]=v;
  });
  return out;
}
function am(){
  var obj={};
  document.getElementById("extra-text").value.split("\n").forEach((line)=>{
    var i=line.indexOf(":");
    if(i<0)return;
    var k=line.slice(0,i).trim(),v=line.slice(i+1).trim();
    if(k)obj[k]=JSON.stringify(v);
  });
  return obj;
}
function ao(s){
  if(!aH.search)return true;
  var q=aH.search.toLowerCase();
  var f=s.filament||{},v=f.vendor||{};
  var hay=[f.name,v.name,f.material,s.location,s.comment].filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(q)!==-1;
}
function ap(){
  var grid=document.getElementById("spool-grid");
  var list=aH.sp.filter(ao);
  if(!list.length){grid.innerHTML='<p class="muted">'+esc(T.bB)+"</p>";return;}
  grid.innerHTML="";
  list.forEach((s)=>{grid.appendChild(aq(s));});
}
function aq(s){
  var f=s.filament||{},v=f.vendor||{};
  var color=f.color_hex?("#"+f.color_hex):"#888888";
  var aT=typeof s.initial_weight==="number";
  var ba=aT?Math.max(0,s.remaining_weight||0):0;
  var pct=(aT&&s.initial_weight>0)?Math.min(100,Math.max(0,(ba/s.initial_weight)*100)):0;
  var aU=aH.bc&&aH.bo===s.id;
  var title=(v.name?v.name+" ":"")+(f.name||("#"+(f.id||"?")));
  var div=document.createElement("div");
  div.className="card"+(s.archived?" archived":"");
  div.innerHTML=
    '<div class="card-head"><span class="dot" style="background:'+esc(color)+'"></span>'
    +'<div class="card-title"><div class="ct-name">'+esc(title)+'</div><div class="ct-sub">'+esc(f.material||"")+'</div></div>'
    +(aU?'<span class="badge badge-good">'+T.bF+'</span>':"")+'</div>'
    +(aT
      ?'<div class="progress"><div class="progress-fill" style="width:'+pct.toFixed(0)+'%"></div></div><div class="weights">'+ba.toFixed(0)+" / "+s.initial_weight.toFixed(0)+" g</div>"
      :'<div class="weights">'+T.bh+" "+(s.used_weight||0).toFixed(0)+" g</div>")
    +(s.location?'<div class="meta">📍 '+esc(s.location)+"</div>":"")
    +(s.comment?'<div class="meta muted">'+esc(s.comment)+"</div>":"")
    +'<div class="row use-row"><input type="number" class="use-input" placeholder="'+esc(T.bK)+'" min="0" step="1">'+btn(T.bL,"use",s.id)+"</div>"
    +'<div class="row actions">'+btn(T.bJ,"edit-spool",s.id)
      +(s.archived?btn(T.bw,"unarchive-spool",s.id):btn(T.bC,"archive-spool",s.id))
      +((aH.bc&&!aU)?btn(T.bs,"make-active",s.id):"")
      +btn(T.bH,"delete-spool",s.id,"btn-danger")+"</div>";
  return div;
}
function ar(mainHtml,editAct,delAct,id){
  return '<div class="row-item"><div class="ri-main">'+mainHtml+'</div><div class="row-actions">'+btn(T.bJ,editAct,id)+btn(T.bH,delAct,id,"btn-danger")+"</div></div>";
}
function as(){
  var fl=document.getElementById("filament-list");
  fl.innerHTML=aH.fi.map((f)=>{
    var color=f.color_hex?("#"+f.color_hex):"#888888";
    var title=(f.vendor?f.vendor.name+" ":"")+(f.name||("#"+f.id));
    return ar('<span class="dot" style="background:'+esc(color)+'"></span> <b>'+esc(title)+'</b> <span class="muted">'+esc(f.material||"")+"</span>","edit-filament","delete-filament",f.id);
  }).join("")||'<p class="muted">—</p>';
  var vl=document.getElementById("vendor-list");
  vl.innerHTML=aH.ve.map((v)=>{
    return ar("<b>"+esc(v.name)+"</b>","edit-vendor","delete-vendor",v.id);
  }).join("")||'<p class="muted">—</p>';
}
function at(titleText,bodyHtml){
  var root=document.getElementById("modal-root");
  root.innerHTML='<div class="overlay"><div class="modal"><div class="modal-head"><h3>'+esc(titleText)+'</h3><button class="btn-icon" type="button" data-act="close-modal">✕</button></div><div class="modal-body">'+bodyHtml+"</div></div></div>";
  root.hidden=false;
}
function au(){var root=document.getElementById("modal-root");root.innerHTML="";root.hidden=true;}
function av(){return '<div class="row actions"><button type="submit" class="btn btn-primary">'+T.save+'</button><button type="button" class="btn" data-act="close-modal">'+T.bG+"</button></div>";}
function aw(aM,f){
  return fld(T.bI,'<select id="ff-vendor"><option value="">—</option>'+aM+'<option value="__new__">'+T.bA+"</option></select>")
    +'<fieldset id="new-vendor-fields" class="subform" hidden>'+fld(T.bu,ipt("fv-name","",""))+"</fieldset>"
    +g2(fld(T.name,ipt("ff-name","",f?esc(f.name||""):"")),fld(T.material,ipt("ff-material",'',f?esc(f.material||""):"")))
    +g2(fld(T.color,ipt("ff-color",' type="color"',f&&f.color_hex?("#"+esc(f.color_hex)):"#2266cc")),nf("ff-density",T.density,f?f.density:1.24,' step="0.01" min="0.01"'))
    +g2(nf("ff-diameter",T.diameter,f?f.diameter:1.75,' step="0.01" min="0.01"'),nf("ff-weight",T.bx,f&&f.weight!=null?f.weight:1000,' step="1"'))
    +nf("ff-spoolweight",T.bd,f&&f.spool_weight!=null?f.spool_weight:"",' step="1"')
    +g2(nf("ff-noztemp",T.bt,f&&f.settings_extruder_temp!=null?f.settings_extruder_temp:""),nf("ff-bedtemp",T.bD,f&&f.settings_bed_temp!=null?f.settings_bed_temp:""));
}
function ax(){
  var body={};
  sb(body,"name","ff-name");
  sb(body,"material","ff-material");
  var color=document.getElementById("ff-color").value;if(color)body.color_hex=color.replace("#","");
  nb(body,"density","ff-density");
  nb(body,"diameter","ff-diameter");
  nb(body,"weight","ff-weight");
  nb(body,"spool_weight","ff-spoolweight");
  var noz=ad("ff-noztemp");if(noz!=null)body.settings_extruder_temp=Math.round(noz);
  var bed=ad("ff-bedtemp");if(bed!=null)body.settings_bed_temp=Math.round(bed);
  return body;
}
function ay(){
  var sel=document.getElementById("ff-vendor");
  var vSel=sel?sel.value:"";
  if(vSel==="__new__"){
    var aW=gv("fv-name");
    if(!aW)return Promise.reject(new Error(T.bu));
    return api("POST","/api/v1/vendor",{name:aW}).then((v)=>{aH.ve.push(v);return v.id;});
  } else if(vSel){return Promise.resolve(parseInt(vSel,10));}
  return Promise.resolve(null);
}
function az(){
  return ay().then((aS)=>{
    var body=ax();
    if(body.density==null)body.density=1.24;
    if(body.diameter==null)body.diameter=1.75;
    if(aS!=null)body.vendor_id=aS;
    return api("POST","/api/v1/filament",body);
  }).then((f)=>{aH.fi.push(f);return f.id;});
}
function aA(p){
  var aJ=!!p;
  var aL=aH.fi.map((f)=>{
    var sel=(p&&p.filament&&p.filament.id===f.id)?" selected":"";
    var label=((f.vendor?f.vendor.name+" ":"")+(f.name||("#"+f.id))+(f.material?" — "+f.material:""));

  }).join("");
  var aM=aH.ve.map((v)=>{return '<option value="'+v.id+'">'+esc(v.name)+"</option>";}).join("");
  var aN=al(p?p.extra:null);
  var aO=Object.keys(aN).map((k)=>{return k+": "+aN[k];}).join("\n");
  var aP=!aJ
    ?(fld(T.filament,'<select id="sf-filament" required><option value="">'+T.bi+"</option>"+aL+'<option value="__new__">'+T.bq+"</option></select>")
      +'<fieldset id="new-filament-fields" class="subform" hidden>'+aw(aM,null)+"</fieldset>")
    :fld(T.filament,"<div>"+esc((p.filament&&p.filament.vendor?p.filament.vendor.name+" ":"")+(p.filament?p.filament.name||"":""))+"</div>");
  var body='<form id="p-form">'+aP
    +g2(nf("sp-initial",T.bm,aJ&&p.initial_weight!=null?p.initial_weight:"",' step="0.1"'),nf("sp-remaining",T.bf,aJ&&p.remaining_weight!=null?p.remaining_weight:"",' step="0.1"'))
    +nf("sp-spoolweight",T.bg,aJ&&p.spool_weight!=null?p.spool_weight:"",' step="0.1"')

function aB(e,aK){
  e.preventDefault();

    var sel=document.getElementById("sf-filament").value;
    if(!sel){ae(T.bi);return;}
    aQ=(sel==="__new__")?az():Promise.resolve(parseInt(sel,10));

  aQ.then((aR)=>{
    var body={};
